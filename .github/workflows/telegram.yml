name: Send APK to Telegram

on:
  release:
    types: [published]

jobs:
  send-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/github-script@v7
        id: get_assets
        with:
          script: |
            const release = context.payload.release;
            return release.assets.map(a => a.browser_download_url);

      - name: Download APK
        run: |
          for url in ${{ join(fromJson(steps.get_assets.outputs.result), ' ') }}; do
            if [[ "$url" == *.apk ]]; then
              filename=$(basename "$url")
              curl -L -o "$filename" "$url"
              echo "APK_FILE=$filename" >> $GITHUB_ENV
            fi
          done

      - name: Send APK to Telegram
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
            -F document=@${{ env.APK_FILE }} \
            -F caption="New release: ${{ github.event.release.tag_name }}
            
            ${{ github.event.release.body }}"